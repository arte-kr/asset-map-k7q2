<style>

body{margin:0;font-family:'Malgun Gothic','맑은 고딕',AppleGothic,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:13px}
header{position:sticky;top:0;z-index:5;background:var(--dark);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px}

header button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:5px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer}
header button:hover{background:rgba(255,255,255,.22)}
header .ic{display:flex;align-items:center;padding:6px 8px}
main{max-width:1100px;margin:0 auto;padding:12px}
button,select,input{font:inherit}
input,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:5px;background:var(--card);color:var(--tx)}
.b1,.b2,.b3{border-radius:5px;padding:8px 14px;border:1px solid var(--bline);cursor:pointer;font-weight:600;font-size:12px}
.b1{background:var(--btn);border-color:var(--btn);color:#fff}.b1:hover{background:var(--btnh)}
.b2{background:var(--card);color:var(--tx)}.b2:hover{background:var(--tag)}
.b3{background:var(--card);color:var(--tx);border-color:var(--bd);padding:5px 10px;font-weight:500}.b3:hover{background:var(--tag)}
.b3.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.dg{color:var(--dg);border-color:var(--dg)}
.muted{color:var(--hint);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px}
.bcard{cursor:pointer;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;background:var(--bcard);border-radius:var(--r);color:#fff;font-size:16px;font-weight:700;word-break:keep-all;line-height:1.3}
.bcard:hover{filter:brightness(1.25)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 13px;border-radius:5px;background:var(--card);color:var(--tx);border:1px solid var(--bd);cursor:pointer;font-size:13px;font-weight:600}
.chip.ref{border-style:dashed}
.chips{align-items:center}.tl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:8px}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.tools{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.scroll{overflow:auto;background:#fff;border:1px solid var(--bd);border-radius:var(--r);max-height:72vh}

.stage{position:relative;line-height:0}

.ed svg{touch-action:none;cursor:crosshair}.hd{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;border:2px solid #1a1917;touch-action:none;cursor:nwse-resize;z-index:2}
.cn{display:inline-block;margin-left:4px;background:#1a1917;color:#fff;border-radius:8px;min-width:16px;padding:0 5px;font-size:10px;line-height:16px;text-shadow:none;vertical-align:middle}
.lb{position:absolute;transform:translate(-50%,-50%);font-size:11px;line-height:1.25;text-align:center;pointer-events:none;color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;font-weight:700;white-space:nowrap}

.notice{background:#fff3cd;color:#664d03;border:1px solid #ffe69c;border-radius:var(--r);padding:10px 14px;margin-bottom:12px;cursor:pointer;font-size:13px}
:root[data-theme=dark] .notice{background:#332f1f;color:#f1d98a;border-color:#5a5030}
header .ic{position:relative}.cnt{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#e5483f;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:8px;align-items:center}
.ai{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;min-width:0;cursor:pointer;font-size:13px}
.row.ar{margin:0 -16px;padding:10px 16px 10px 20px;box-shadow:inset 4px 0 0 var(--sc,transparent)}.ar.sc-ok{--sc:#00B050}.ar.sc-wn{--sc:#F59E0B}.ar.sc-er{--sc:#FF0000}.ar.sc-in{--sc:#185EA5}.ar.sc-ex{--sc:#534AB7}
.ah{padding-left:20px!important}
.ai.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ai>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ah{margin:0 -16px;padding:9px 16px;background:var(--tag);color:var(--tx);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}.ah .ai{cursor:default;font-size:13px;font-weight:700}
.ah [data-sort]{cursor:pointer;user-select:none}.ah [data-sort]:hover{text-decoration:underline}
.ba{display:flex;gap:4px;justify-content:flex-end;align-items:center}.ba .b3{white-space:nowrap;flex-shrink:0}.ba select{width:96px;padding:5px 6px;font-size:12px}
@media(max-width:640px){.arow{grid-template-columns:minmax(0,1fr)}.ba{justify-content:flex-start}.ah .ba{display:none}}
.row{padding:10px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.rt{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.ra{display:flex;gap:6px;flex-wrap:wrap}
.ra select{width:auto;flex:1;min-width:120px;padding:5px 8px;font-size:12px}
.hist{margin-top:8px;font-size:12px;color:var(--mu);background:var(--soft);border:1px solid var(--bd);border-radius:5px;padding:8px 10px;line-height:1.7}
.sec{margin-bottom:14px}
.sec h2{font-size:13px;font-weight:700;margin:-14px -16px 12px;padding:9px 16px;background:var(--dark2);color:#fff;letter-spacing:.2px;border-radius:6px 6px 0 0}
.fr{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.fr>*{flex:1;min-width:130px}.fr>button{flex:0 0 auto}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.li:first-of-type{border-top:0}.li>span{flex:1;min-width:120px}
.li>.sw{flex:0 0 auto;min-width:0;display:flex;gap:5px}.sw i{width:20px;height:20px;border-radius:5px;cursor:pointer;border:2px solid transparent;display:inline-block}.sw i.on{border-color:var(--tx)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:5px;z-index:40;font-size:13px;max-width:90vw;display:none}
#toast.er{background:var(--dg)}
.empty{text-align:center;color:var(--hint);padding:36px 12px}
</style>

<body>

<script>
const SB_URL='https://omqnuhrshddkoarbiiei.supabase.co';
const SB_KEY='sb_publishable_xBcS0_fg1WGzDwn8JUNgew_p5GK40oc';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D={b:[],f:[],z:[],a:[],s:[]};
let cur=null;
let zoom=1;
const st={fpb:null,edf:null};

const byId=(arr,id)=>arr.find(x=>x.id===id);

const fpName=f=>{const b=byId(D.b,f.building_id)?.name||'';return f.name===b?b:`${b} / ${f.name}`};
const pts2s=p=>p.map(q=>q.x+','+q.y).join(' ');
const center=p=>({x:p.reduce((s,q)=>s+q.x,0)/p.length,y:p.reduce((s,q)=>s+q.y,0)/p.length});

function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'er':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',err?5000:2500)}
async function act(fn){try{await fn()}catch(e){toast(e.code==='23505'?(/code/.test(e.message)?'같은 도면코드가 이미 있습니다. 도면명이나 도면코드를 다르게 입력하세요.':'같은 이름이 이미 있습니다.'):(e.message||String(e)),true)}}
async function rpc(fn,args){const{data,error}=await sb.rpc(fn,args);if(error)throw error;return data}
async function q(p){const r=await p;if(r.error)throw r.error;return r.data}

async function load(){
  const s=t=>sb.from(t).select('*').order('created_at');
  const r=await Promise.all([sb.from('buildings').select('*').order('sort').order('created_at'),sb.from('floorplans').select('*').order('sort').order('created_at'),s('zones'),s('assets'),sb.from('staff').select('*').order('sort').order('created_at')]);
  for(const x of r)if(x.error)throw x.error;
  [D.b,D.f,D.z,D.a,D.s]=r.map(x=>x.data);
}

function openOv(id,html){const o=$(id);o.hidden=false;o.innerHTML=html;return o}
let ret=null;
function closeModal(){$('#ov').hidden=true;$('#ov').innerHTML='';cur=null;ret=null}
function backToPool(){const r=ret;ret=null;cur={t:'pool',qs:r?.qs||'',f:r?.f||'all'};drawPool()}
function openZoneFromPool(zid){ret={qs:cur.qs,f:cur.f};openZone(zid)}
function ask(title,fields=[],ok='확인',mount){
  return new Promise(res=>{
    const f=fields.map(x=>`<label>${esc(x.label)}${x.type==='select'
      ?`<select name="${x.k}">${x.options.map(o=>`<option value="${esc(o.v)}"${o.v===x.value?' selected':''}>${esc(o.t)}</option>`).join('')}</select>`
      :`<input name="${x.k}" type="${x.type||'text'}" value="${esc(x.value||'')}" placeholder="${esc(x.ph||'')}" autocomplete="off"${x.ro?' readonly style="background:var(--soft);color:var(--hint)"':''}>`}</label>`).join('');
    const o=openOv('#ov2',`<div class="box sm"><div class="mh"><b>${esc(title)}</b></div><form class="mb">${f}<div class="btns"><button type="button" class="b2" id="c">취소</button><button class="b1">${esc(ok)}</button></div></form></div>`);
    const fm=o.querySelector('form');fm.querySelector('input:not([readonly]),select')?.focus();if(mount)mount(fm);
    const done=v=>{o.hidden=true;o.innerHTML='';res(v)};
    fm.onsubmit=e=>{e.preventDefault();done(Object.fromEntries(new FormData(fm)))};
    o.querySelector('#c').onclick=()=>done(null);
  });
}
const confirmBox=(m,ok)=>ask(m,[],ok).then(v=>v!==null);
const whoField=()=>{const last=localStorage.getItem('asset_user')||'';
  return D.s.length?{k:'by',label:'작업자',type:'select',value:last,options:D.s.map(s=>({v:s.name,t:s.name}))}:{k:'by',label:'작업자 (설정에서 직원 명단을 등록하면 선택할 수 있습니다)',value:last,ph:'이름'}};
const byOf=v=>{const n=(v.by||'').trim();if(!n)throw new Error('작업자를 선택하세요.');try{localStorage.setItem('asset_user',n)}catch(e){}return n};

/* ---------- 라우팅 ---------- */
const SVG_O='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
const ICON_SUN=SVG_O+'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON=SVG_O+'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_SEARCH=SVG_O+'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
const ICON_REPORT=SVG_O+'<path d="M6 2h8l5 5v15H6z"/><path d="M14 2v5h5"/><path d="M9 13h7M9 17h7"/></svg>';
const ICON_HOME=SVG_O+'<path d="M3 11l9-8 9 8"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg>';
const ICON_GEAR=SVG_O+'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
function toggleTheme(){
  const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem('asset_theme',t)}catch(e){}
  document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0a0a09':'#141412';
  render(true);
}
function go(h){location.hash=h}
window.addEventListener('hashchange',()=>{zoom=1;render()});
async function render(force){
  const [,r,id,idx]=location.hash.split('/');
  const top=$('#top'),app=$('#app');
  const gear='<button onclick="go(\'#/s\')" class="ic" aria-label="설정" title="설정">'+ICON_GEAR+'</button>',list=`<button class="ic" onclick="openPool()" aria-label="자산 검색" title="자산 검색">${ICON_SEARCH}${unCount()?`<span class="cnt">${unCount()}</span>`:''}</button>`,tg=`<button class="ic" onclick="toggleTheme()" aria-label="다크/라이트 모드 전환" title="다크/라이트 모드 전환">${document.documentElement.dataset.theme==='dark'?ICON_SUN:ICON_MOON}</button>`;
  const rp=`<button class="ic" onclick="go('#/p')" aria-label="리포트" title="리포트">${ICON_REPORT}</button>`;
  const home=`<button class="ic" onclick="go('#/')" aria-label="홈" title="홈">${ICON_HOME}</button>`;
  if(r==='r'&&byId(D.f,id)&&(byId(D.f,id).refs||[])[+idx]){
    const f=byId(D.f,id),b=byId(D.b,f.building_id),rf=f.refs[+idx];
    top.innerHTML=`<button onclick="go('#/f/${f.id}')">←</button><h1>${esc(b.name)}</h1>${home}${tg}${list}${rp}${gear}`;
    app.innerHTML=viewRef(f,b,+idx);bindPinch();if(isPdf(rf.path))renderPdf(imgUrl(rf.path));
  }else if(r==='f'&&byId(D.f,id)){
    const f=byId(D.f,id),b=byId(D.b,f.building_id);
    top.innerHTML=`<button onclick="go('#/')">←</button><h1>${esc(b.name)}</h1>${home}${tg}${list}${rp}${gear}`;
    app.innerHTML=viewPlan(f,b);bindPlan();bindPinch();
  }else if(r==='p'){
    top.innerHTML=`<button onclick="go('#/')">←</button><h1>리포트</h1>${home}${tg}`;
    app.innerHTML=await viewReport();bindReport();
  }else if(r==='s'){
    top.innerHTML=`<button onclick="go('#/')">←</button><h1>설정</h1>${home}${rp}${tg}`;
    if(!force&&ed.pts.length&&app.querySelector('#edst')){return}
    app.innerHTML=await viewSettings();bindSettings();
  }else{
    top.innerHTML=`<h1>자산관리</h1>${tg}${list}${rp}${gear}`;
    app.innerHTML=viewHome();
  }
  fitChips();
}
function fitChips(){
  const cs=[...document.querySelectorAll('#app .chips .chip')];
  if(!cs.length)return;
  const box=document.createElement('div');box.style.cssText='position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap';
  [...D.b.map(b=>b.name),...D.f.map(f=>f.name),'도면코드'].forEach(t=>{const e=document.createElement('div');e.className='chip';e.textContent=t;box.appendChild(e)});
  document.body.appendChild(box);
  const m=Math.max(0,...[...box.children].map(e=>e.offsetWidth));
  box.remove();
  cs.forEach(c=>{c.style.minWidth=m+'px';c.style.textAlign='center'});
}

let pin={mx:0,my:0};
function bindPinch(){
  const sc=$('.scroll'),stg=$('#stage');if(!sc||!stg)return;
  let d0=0,z0=1,cx=0,cy=0;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  const apply=z=>{zoom=Math.max(1,Math.min(6,z));stg.style.width=zoom*100+'%';sc.scrollLeft=cx*stg.offsetWidth-pin.mx;sc.scrollTop=cy*stg.offsetHeight-pin.my};
  const anchor=(x,y)=>{const r=sc.getBoundingClientRect();pin={mx:x-r.left,my:y-r.top};cx=(sc.scrollLeft+pin.mx)/stg.offsetWidth;cy=(sc.scrollTop+pin.my)/stg.offsetHeight};
  sc.addEventListener('touchstart',e=>{if(e.touches.length===2){d0=dist(e.touches);z0=zoom;anchor((e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2)}},{passive:true});
  sc.addEventListener('touchmove',e=>{if(e.touches.length===2&&d0){e.preventDefault();apply(z0*dist(e.touches)/d0)}},{passive:false});
  sc.addEventListener('touchend',e=>{if(e.touches.length<2)d0=0});
  sc.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();anchor(e.clientX,e.clientY);apply(zoom*(e.deltaY<0?1.15:1/1.15))},{passive:false});
}

function bindPlan(){
  let moved=0;
  $('#app').querySelectorAll('[data-z]').forEach(e=>e.onclick=()=>{if(moved){moved=0;return}openZone(e.dataset.z)});
  const sv=$('#stage svg'),stg=$('#stage');if(!sv)return;
  const polys=[...sv.querySelectorAll('polygon')],lbs=[...stg.querySelectorAll('.lb')];
  let mv=null;
  sv.addEventListener('touchmove',e=>{if(mv&&mv.on)e.preventDefault()},{passive:false});
  sv.addEventListener('contextmenu',e=>e.preventDefault());
  polys.forEach((pl,i)=>{
    const z=byId(D.z,pl.dataset.z),lb=lbs[i];
    pl.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      mv={x:e.clientX,y:e.clientY,on:false,dx:0,dy:0,id:e.pointerId};
      mv.t=setTimeout(()=>{mv.on=true;pl.setPointerCapture(mv.id);pl.style.fillOpacity='.6';pl.style.strokeDasharray='3 2';if(navigator.vibrate)navigator.vibrate(30)},500);
    });
    pl.addEventListener('pointermove',e=>{
      if(!mv)return;
      if(!mv.on){if(Math.hypot(e.clientX-mv.x,e.clientY-mv.y)>10){clearTimeout(mv.t);mv=null}return}
      const r=sv.getBoundingClientRect(),xs=z.points.map(p=>p.x),ys=z.points.map(p=>p.y);
      mv.dx=Math.min(100-Math.max(...xs),Math.max(-Math.min(...xs),(e.clientX-mv.x)/r.width*100));
      mv.dy=Math.min(100-Math.max(...ys),Math.max(-Math.min(...ys),(e.clientY-mv.y)/r.height*100));
      pl.setAttribute('transform',`translate(${mv.dx} ${mv.dy})`);
      if(lb){lb.style.transform=`translate(calc(-50% + ${mv.dx/100*r.width}px),calc(-50% + ${mv.dy/100*r.height}px))`}
    });
    const end=e=>{
      if(!mv)return;clearTimeout(mv.t);const m=mv;mv=null;
      if(!m.on)return;moved=1;setTimeout(()=>{moved=0},400);
      if(e.type==='pointercancel'||(!m.dx&&!m.dy)){render(true);return}
      act(async()=>{await q(sb.from('zones').update({points:z.points.map(p=>({x:+(p.x+m.dx).toFixed(2),y:+(p.y+m.dy).toFixed(2)}))}).eq('id',z.id));await refresh();toast(`'${z.name}' 구역을 이동했습니다.`)});
    };
    pl.addEventListener('pointerup',end);pl.addEventListener('pointercancel',end);
  });
}
async function renderPdf(url){
  const w=$('#pdfwrap'),tok=renderPdf.t=Symbol();
  try{
    if(!window.pdfjsLib)throw new Error('PDF 보기 기능을 불러오지 못했습니다. 새로고침해 주세요.');
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument(url).promise;
    if(renderPdf.t!==tok)return;
    w.innerHTML='';w.style.padding='0';
    for(let i=1;i<=pdf.numPages;i++){
      const pg=await pdf.getPage(i),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:1800/v0.width}),c=document.createElement('canvas');
      c.width=vp.width;c.height=vp.height;c.style.cssText='width:100%;display:block;background:#fff;margin-bottom:6px';
      if(renderPdf.t!==tok)return;
      w.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
  }catch(e){if(renderPdf.t===tok)w.textContent='PDF를 표시하지 못했습니다: '+(e.message||e)}
}

async function xlCompare(file){

  <div class="scroll"><div class="stage ed" id="edst"><img src="${imgUrl(byId(D.f,edf)?.image_path)}" alt=""><svg id="edsv" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div id="edlb"></div><div id="edhd" class="hd" hidden></div></div></div>
  <div class="fr" style="margin-top:10px"><input id="zn" placeholder="구역 이름"><select id="zc" style="flex:0 0 110px">${COLORS.map(c=>`<option value="${c}" style="background:${c}">${c}</option>`).join('')}</select><button class="b1" id="zsv">${ed.zid?'수정 저장':'구역 추가'}</button>${ed.zid?'<button class="b2" id="znew">취소</button>':''}</div>
  ${zs.map(z=>`<div class="li"><span><i style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${z.color}"></i> ${esc(z.name)} <span class="muted">자산 ${assetsIn(z.id).length}</span></span><button class="b3" data-zed="${z.id}">수정</button><button class="b3 dg" data-zdel="${z.id}">삭제</button></div>`).join('')}`:'<div class="muted">먼저 도면을 추가하세요.</div>'}</div>
  <div class="card sec"><h2>직원 명단</h2>${D.s.map(s=>`<div class="li"><span>${esc(s.name)}</span><button class="b3 dg" data-sdel="${s.id}">삭제</button></div>`).join('')||'<div class="muted">등록된 직원이 없습니다. 이름을 추가하면 자산 이동·등록 때 작업자와 관리자를 선택할 수 있습니다.</div>'}
  <div class="fr" style="margin-top:10px"><input id="sn" placeholder="직원 이름"><button class="b1" id="sad">직원 추가</button></div></div>
  <div class="card sec"><h2>자산 엑셀 업로드</h2><div class="muted" style="margin-bottom:8px">양식에 맞춰 작성한 엑셀을 올리면 현재 자산과 대조합니다. 일치하는 자산은 그대로 두고, 추가·변경·삭제만 확인한 뒤 반영합니다.</div><div class="fr"><button class="b3" id="xlt">양식 다운로드</button><label class="b1" style="cursor:pointer;margin:0">엑셀 선택·대조<input id="xlf" type="file" accept=".xlsx" hidden></label></div></div>
  <div class="card sec"><h2>삭제 암호</h2><div class="muted" style="margin-bottom:8px">자산이 있는 구역을 삭제할 때 필요합니다. ${has?'암호가 설정되어 있습니다.':'<b style="color:var(--dg)">아직 설정되지 않았습니다.</b>'}</div>
  <div class="fr">${has?'<input id="pwo" type="password" placeholder="기존 암호">':''}<input id="pwn" type="password" placeholder="새 암호 (4자 이상)"><button class="b1" id="pwb">${has?'암호 변경':'암호 설정'}</button></div></div>`;
}
function bindSettings(){
  const A=$('#app'),on=(s,fn)=>{const e=A.querySelector(s);if(e)e.onclick=()=>act(fn)};
  on('#sad',async()=>{const n=$('#sn').value.trim();if(!n)throw new Error('직원 이름을 입력하세요.');await q(sb.from('staff').insert({name:n,sort:D.s.length+1}));await refresh()});
  A.querySelectorAll('[data-sdel]').forEach(e=>e.onclick=()=>act(async()=>{const s=byId(D.s,e.dataset.sdel);if(!await confirmBox(`직원 '${s.name}'을(를) 명단에서 삭제할까요? 이미 남은 변경 이력은 그대로 유지됩니다.`,'삭제'))return;await q(sb.from('staff').delete().eq('id',s.id));await refresh()}));
  on('#bad',async()=>{const n=$('#bn').value.trim();if(!n)throw new Error('건물 이름을 입력하세요.');await q(sb.from('buildings').insert({name:n,sort:D.b.length+1}));await refresh()});
  A.querySelectorAll('[data-bc]').forEach(e=>e.onclick=()=>act(async()=>{await q(sb.from('buildings').update({color:e.dataset.c||null}).eq('id',e.dataset.bc));await refresh()}));
  A.querySelectorAll('[data-bren]').forEach(e=>e.onclick=()=>act(async()=>{const b=byId(D.b,e.dataset.bren),v=await ask('건물 이름 변경',[{k:'n',label:'이름',value:b.name}]);if(!v||!v.n.trim())return;await q(sb.from('buildings').update({name:v.n.trim()}).eq('id',b.id));await refresh()}));
  A.querySelectorAll('[data-bdel]').forEach(e=>e.onclick=()=>act(async()=>{const b=byId(D.b,e.dataset.bdel);if(D.f.some(f=>f.building_id===b.id))throw new Error('도면이 있는 건물은 삭제할 수 없습니다. 도면을 먼저 삭제하세요.');if(!await confirmBox(`건물 '${b.name}'을(를) 삭제할까요?`,'삭제'))return;await q(sb.from('buildings').delete().eq('id',b.id));await refresh()}));
  A.querySelectorAll('[data-fpb]').forEach(e=>e.onclick=()=>{st.fpb=e.dataset.fpb;render()});
  on('#fad',async()=>{
    const file=$('#ff').files[0],rf=[...$('#fr').files];
    if(!file)throw new Error('일반 도면 이미지 파일을 선택하세요.');
    const bn=byId(D.b,st.fpb).name,n=D.f.filter(f=>f.building_id===st.fpb).length,name=n?`${bn} ${n+1}`:bn;let code=name;while(D.f.some(f=>f.code===code))code+='-'+Math.floor(Math.random()*90+10);
    const path=await upload(file,code),refs=[];
    for(const x of rf)refs.push({name:x.name.replace(/\.[^.]+$/,''),path:await upload(x,code+'_ref')});
    await q(sb.from('floorplans').insert({building_id:st.fpb,code,name,image_path:path,refs,sort:D.f.length+1}));await refresh();toast('도면을 추가했습니다.');
  });
  A.querySelectorAll('[data-fimg]').forEach(e=>e.onchange=()=>act(async()=>{const f=byId(D.f,e.dataset.fimg),file=e.files[0];if(!file)return;const path=await upload(file,f.code);await q(sb.from('floorplans').update({image_path:path}).eq('id',f.id));await refresh();toast('이미지를 교체했습니다.')}));
  A.querySelectorAll('[data-fref]').forEach(e=>e.onchange=()=>act(async()=>{const f=byId(D.f,e.dataset.fref),fl=[...e.files];if(!fl.length)return;const add=[];for(const x of fl)add.push({name:x.name.replace(/\.[^.]+$/,''),path:await upload(x,f.code+'_ref')});await q(sb.from('floorplans').update({refs:[...(f.refs||[]),...add]}).eq('id',f.id));await refresh();toast('도면코드 도면을 추가했습니다.')}));
  A.querySelectorAll('[data-rdel]').forEach(e=>e.onclick=()=>act(async()=>{const[fid,i]=e.dataset.rdel.split(':'),f=byId(D.f,fid),r=(f.refs||[])[+i];if(!await confirmBox(`도면코드 도면 '${r.name}'을(를) 목록에서 삭제할까요?`,'삭제'))return;await q(sb.from('floorplans').update({refs:f.refs.filter((_,k)=>k!==+i)}).eq('id',f.id));await refresh()}));
  A.querySelectorAll('[data-fren]').forEach(e=>e.onclick=()=>act(async()=>{const f=byId(D.f,e.dataset.fren),v=await ask('도면 이름 변경',[{k:'name',label:'도면명 (도면 화면 위쪽 버튼에 표시됩니다)',value:f.name}]);if(!v||!v.name.trim())return;await q(sb.from('floorplans').update({name:v.name.trim()}).eq('id',f.id));await refresh();toast('이름을 변경했습니다.')}));
  A.querySelectorAll('[data-fdel]').forEach(e=>e.onclick=()=>act(async()=>{const f=byId(D.f,e.dataset.fdel);if(zonesOf(f.id).length)throw new Error('구역이 있는 도면은 삭제할 수 없습니다. 구역을 먼저 삭제하세요.');if(!await confirmBox(`도면 '${f.name}'을(를) 삭제할까요?`,'삭제'))return;await q(sb.from('floorplans').delete().eq('id',f.id));await refresh()}));
  A.querySelectorAll('[data-edb]').forEach(e=>e.onclick=()=>{st.edf=D.f.find(f=>f.building_id===e.dataset.edb)?.id;resetEd();render()});
  A.querySelectorAll('[data-edf]').forEach(e=>e.onclick=()=>{st.edf=e.dataset.edf;resetEd();render()});
  bindEditor();
  on('#xlt',xlTemplate);
  const xf=A.querySelector('#xlf');if(xf)xf.onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)act(()=>xlCompare(f))};
  on('#pwb',async()=>{await rpc('set_delete_password',{p_new:$('#pwn').value,p_old:$('#pwo')?.value||null});toast('삭제 암호를 저장했습니다.');render()});
}
async function upload(file,code){
  const ext=(file.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path=`${code.replace(/[^A-Za-z0-9_-]/g,'_')||'plan'}_${Date.now()}${Math.random().toString(36).slice(2,5)}.${ext}`;
  const{error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||'image/png'});
  if(error)throw error;return path;
}

/* ---------- 구역 그리기 ---------- */
function resetEd(){ed={zid:null,tool:ed.tool,pts:[],sh:null,mode:'add'}}
const ED_DEF=1.8,cl100=v=>+Math.min(100,Math.max(0,v)).toFixed(2);
const shPts=(s,W,H)=>{const k=W/H;return s.t==='circle'?Array.from({length:48},(_,i)=>{const a=i/48*2*Math.PI;return{x:cl100(s.cx+s.s*Math.cos(a)),y:cl100(s.cy+s.s*k*Math.sin(a))}}):[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>({x:cl100(s.cx+a*s.s),y:cl100(s.cy+b*s.s*k)}))};
const ptsSh=p=>{const xs=p.map(q=>q.x),ys=p.map(q=>q.y),x0=Math.min(...xs),x1=Math.max(...xs);return{t:p.length===48?'circle':'square',cx:(x0+x1)/2,cy:(Math.min(...ys)+Math.max(...ys))/2,s:(x1-x0)/2}};
function drawEd(){
  const sv=$('#edsv');if(!sv)return;
  const others=zonesOf(st.edf).filter(z=>z.id!==ed.zid);
  const col=$('#zc')?.value||COLORS[0];
  sv.innerHTML=others.map(z=>`<polygon data-oz="${z.id}" points="${pts2s(z.points)}" fill="${z.color}" fill-opacity=".25" stroke="${z.color}" style="cursor:${ed.mode==='move'?'move':'crosshair'}"/>`).join('')
    +(ed.pts.length>1?`<polygon points="${pts2s(ed.pts)}" fill="${col}" fill-opacity=".4" stroke="${col}" stroke-dasharray="3 2" style="stroke-width:2;vector-effect:non-scaling-stroke"/>`:'')
    +'';
  const hd=$('#edhd');if(hd){const s=ed.pts.length&&ed.sh,r=sv.getBoundingClientRect();hd.hidden=!s;if(s){hd.style.left=(ed.sh.cx+ed.sh.s)+'%';hd.style.top=(ed.sh.t==='circle'?ed.sh.cy:ed.sh.cy+ed.sh.s*r.width/r.height)+'%'}}
  $('#edlb').innerHTML=labels(others);
}
function bindEditor(){
  const sv=$('#edsv');if(!sv)return;
  const pct=e=>{const r=sv.getBoundingClientRect();const c=v=>+Math.min(100,Math.max(0,v)).toFixed(2);return{x:c((e.clientX-r.left)/r.width*100),y:c((e.clientY-r.top)/r.height*100)}};
  const WH=()=>{const r=sv.getBoundingClientRect();return[r.width,r.height]};
  const hit=p=>{const[W,H]=WH(),s=ed.sh,dx=p.x-s.cx,dy=(p.y-s.cy)*H/W;return s.t==='circle'?Math.hypot(dx,dy)<=s.s:Math.abs(dx)<=s.s&&Math.abs(dy)<=s.s};
  const move=(c)=>{const s=ed.sh,dx=c.x-s.cx,dy=c.y-s.cy;ed.pts=ed.pts.map(q=>({x:cl100(q.x+dx),y:cl100(q.y+dy)}));s.cx=c.x;s.cy=c.y};
  let drag=null;
  const inPoly=(p,pts)=>{let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)c=!c}return c};
  sv.onpointerdown=e=>{e.preventDefault();const p=pct(e),[W,H]=WH();
    if(ed.mode==='move'){const z=[...zonesOf(st.edf).filter(x=>x.id!==ed.zid)].reverse().find(x=>inPoly(p,x.points));if(z){drag={z,sx:p.x,sy:p.y,dx:0,dy:0};sv.setPointerCapture(e.pointerId)}return}
    if(ed.pts.length&&ed.sh&&hit(p))drag={ox:p.x-ed.sh.cx,oy:p.y-ed.sh.cy};
    else{if(!ed.sh||!ed.pts.length)ed.sh={t:ed.tool==='circle'?'circle':'square',cx:p.x,cy:p.y,s:ED_DEF};else{ed.sh.cx=p.x;ed.sh.cy=p.y}ed.pts=shPts(ed.sh,W,H);drag={ox:0,oy:0};drawEd()}
    sv.setPointerCapture(e.pointerId)};
  sv.onpointermove=e=>{if(drag?.z){const p=pct(e),xs=drag.z.points.map(q=>q.x),ys=drag.z.points.map(q=>q.y);drag.dx=Math.min(100-Math.max(...xs),Math.max(-Math.min(...xs),p.x-drag.sx));drag.dy=Math.min(100-Math.max(...ys),Math.max(-Math.min(...ys),p.y-drag.sy));sv.querySelector(`[data-oz="${drag.z.id}"]`)?.setAttribute('transform',`translate(${drag.dx} ${drag.dy})`);return}
    if(drag){const p=pct(e);move({x:p.x-drag.ox,y:p.y-drag.oy});drawEd()}};
  sv.onpointerup=()=>{if(drag?.z){const d=drag;drag=null;if(d.dx||d.dy)act(async()=>{await q(sb.from('zones').update({points:d.z.points.map(p=>({x:+(p.x+d.dx).toFixed(2),y:+(p.y+d.dy).toFixed(2)}))}).eq('id',d.z.id));await refresh();drawEd();toast(`'${d.z.name}' 구역을 이동했습니다.`)});else drawEd();return}
    if(drag){drag=null;const t=$('#edst')?.parentElement.previousElementSibling.querySelector('.muted');if(t)t.textContent='모양을 끌어 이동하고, 점을 끌어 크기를 조절하세요'}};
  const hd=$('#edhd');
  hd.onpointerdown=e=>{e.preventDefault();e.stopPropagation();hd.setPointerCapture(e.pointerId);hd.dr=1};
  hd.onpointermove=e=>{if(!hd.dr)return;const p=pct(e),[W,H]=WH(),s=ed.sh,dx=Math.abs(p.x-s.cx),dy=Math.abs(p.y-s.cy)*H/W;s.s=Math.min(30,Math.max(.8,s.t==='circle'?Math.hypot(dx,dy):Math.max(dx,dy)));ed.pts=shPts(s,W,H);drawEd()};
  hd.onpointerup=()=>{hd.dr=0};
  if(ed.pts.length&&!ed.sh)ed.sh=ptsSh(ed.pts);
  const tool=t=>{ed.tool=t;if(ed.sh&&ed.pts.length){const[W,H]=WH();ed.sh.t=t==='circle'?'circle':'square';ed.pts=shPts(ed.sh,W,H)}if(cur?.t==='zadd')drawZoneAdd();else render(true)};
  $('#trect').onclick=()=>tool('rect');$('#tcircle').onclick=()=>tool('circle');
  $('#tmove').onclick=()=>{ed.mode=ed.mode==='move'?'add':'move';if(cur?.t==='zadd')drawZoneAdd();else render(true)};
  $('#tclr').onclick=()=>{ed.pts=[];ed.sh=null;drawEd()};
  $('#zc').onchange=drawEd;
  const z=ed.zid&&byId(D.z,ed.zid);
  if(z){$('#zn').value=z.name;$('#zc').value=z.color}
  $('#znew')?.addEventListener('click',()=>{resetEd();render()});
  $('#zsv').onclick=()=>act(async()=>{
    const name=$('#zn').value.trim();
    if(!name)throw new Error('구역 이름을 입력하세요.');
    if(ed.pts.length<3)throw new Error('도면 위에 구역 모양을 먼저 그리세요.');
    const row={name,color:$('#zc').value,points:ed.pts};
    if(ed.zid)await q(sb.from('zones').update(row).eq('id',ed.zid));
    else await q(sb.from('zones').insert({...row,floorplan_id:st.edf}));
    resetEd();if(cur?.t==='zadd')closeModal();await refresh();toast('구역을 저장했습니다.');
  });
  $('#app').querySelectorAll('[data-zed]').forEach(e=>e.onclick=()=>{const z=byId(D.z,e.dataset.zed);ed.zid=z.id;ed.sh=null;ed.pts=z.points.map(p=>({...p}));render(true).then(()=>$('#edst')?.scrollIntoView({block:'center'}))});
  $('#app').querySelectorAll('[data-zdel]').forEach(e=>e.onclick=()=>act(()=>delZone(e.dataset.zdel)));
  drawEd();
}
async function delZone(id){
  const z=byId(D.z,id),n=assetsIn(id).length;
  const v=await ask(n>0?`'${z.name}' 구역에 자산 ${n}개가 있습니다`:`구역 '${z.name}'을(를) 삭제할까요?`,[...(n>0?[{k:'pw',label:'삭제 암호를 입력하세요. 구역만 삭제되고 자산은 미배정으로 남습니다.',type:'password'}]:[]),whoField()],'삭제');
  if(!v)return;
  const pw=n>0?v.pw:null,by=byOf(v);
  const c=await rpc('delete_zone',{p_zone:id,p_password:pw,p_by:by});
  if(ed.zid===id)resetEd();
  await refresh();toast(c>0?`구역을 삭제했습니다. 자산 ${c}개는 미배정입니다.`:'구역을 삭제했습니다.');
}

/* ---------- 새 버전 자동 확인 ---------- */
const APP_VER='20261014184223';
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'reload'});
    const m=(await r.text()).match(/const APP_VER='(\d+)'/);
    if(!m||m[1]===APP_VER)return;
    if(sessionStorage.getItem('asset_upd')===m[1])return;
    if(!$('#ov').hidden||!$('#ov2').hidden||ed.pts.length)return setTimeout(checkUpdate,30000);
    sessionStorage.setItem('asset_upd',m[1]);
    await fetch(location.pathname,{cache:'reload'});
    toast('새 버전으로 업데이트합니다…');
    setTimeout(()=>location.reload(),600);
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
setInterval(checkUpdate,300000);

/* ---------- 시작 ---------- */
async function refresh(){
  await load();
  if(cur?.t==='zone')drawZone();else if(cur?.t==='pool')drawPool();
  await render();
}
let rt;
function live(){
  sb.channel('asset-live').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(rt);rt=setTimeout(()=>act(refresh),400)}).subscribe();
}
(async()=>{
  try{await load();await render();live();checkUpdate()}
  catch(e){$('#app').innerHTML=`<div class="empty">데이터를 불러오지 못했습니다.<br>${esc(e.message||e)}</div>`}
})();
</script>
